services:
  postgres:
    image: postgres:17-alpine
    container_name: kitchen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchen-api
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable"
      RESTAURANT_SERVICE_URL: "http://restaurant-mock:8081"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      restaurant-mock:
        condition: service_started

  restaurant-mock:
    build:
      context: ./restaurant-mock
      dockerfile: Dockerfile
    container_name: kitchen-restaurant-mock
    restart: unless-stopped
    environment:
      HTTP_PORT: "8081"
    ports:
      - "8081:8081"

volumes:
  postgres_data:
